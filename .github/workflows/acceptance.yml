name: Search acceptance test

# Can an English query find records written in other languages? Builds the glossary from
# the repository, exports the search lexicon, and compares potion-multilingual-128M alone,
# with glossary concepts, with glossary keywords (hybrid) and BGE-M3 as the reference.
# Takes about an hour. Results: docs/evaluations/embedding-tests.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet model2vec sentence-transformers numpy
      - name: Build glossary and export lexicons
        run: |
          python tools/build_glossary.py
          python tools/export_lexicon.py --holdout tests/acceptance/corpus.tsv
          python tools/export_lexicon.py tests/acceptance/lexicon_full.tsv.xz
          python tools/export_lexicon.py tests/acceptance/lexicon_no_inspire.tsv.xz --exclude inspire-regulation
          test -f tests/acceptance/parallel_eu.tsv.xz || python tools/build_parallel_corpus.py
      - name: Run the test (real records, INSPIRE concepts held out)
        working-directory: tests/acceptance
        run: python acceptance.py | tee acceptance.log
      - name: Run the EU directive test with and without INSPIRE names
        working-directory: tests/acceptance
        run: |
          MODE=parallel LEXICON=lexicon_full.tsv.xz OUTPUT=parallel_with.md python acceptance.py | tee parallel_with.log
          MODE=parallel LEXICON=lexicon_no_inspire.tsv.xz OUTPUT=parallel_without.md python acceptance.py | tee parallel_without.log
          python compare_parallel.py parallel_with.json parallel_without.json > parallel.md
      - run: cat tests/acceptance/acceptance.md tests/acceptance/parallel.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance
          path: |
            tests/acceptance/acceptance.md
            tests/acceptance/acceptance.log
            tests/acceptance/records.json
            tests/acceptance/parallel*.md
            tests/acceptance/parallel*.json
            tests/acceptance/parallel*.log
            tests/acceptance/parallel_eu.tsv.xz
